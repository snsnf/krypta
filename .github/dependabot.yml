# Weekly pull requests for newer dependency versions.
#
# The audit in scripts/ci.sh fails on a new advisory, but it cannot tell that a
# fix for an ignored one has been released: its stale-entry check fires only
# after the lockfile moves. These pull requests are what move it. Minor and
# patch bumps arrive as one grouped pull request per ecosystem, and majors one
# at a time, since those are the ones that need reading.
version: 2

updates:
  # sha2 and blake2 0.11 move to digest 0.11 while the rest of the tree is
  # still on 0.10, so taking them now means two copies for no fix.
  # webauthn-rs 0.6 verifies RSA passkeys with a release candidate of the rsa
  # crate, which carries RUSTSEC-2023-0071 with no fixed release. Verification
  # uses public keys only, out of that advisory's reach, but 0.5 carries no
  # advisory at all, so it waits for a fixed rsa.
  - package-ecosystem: cargo
    directory: /apps/api
    schedule:
      interval: weekly
    ignore:
      - dependency-name: sha2
        update-types: ["version-update:semver-minor"]
      - dependency-name: blake2
        update-types: ["version-update:semver-minor"]
      - dependency-name: webauthn-rs
        update-types: ["version-update:semver-minor"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # typescript-eslint supports TypeScript below 6.1 only, so a TypeScript
  # major breaks lint until it catches up. @types/node follows the runtime,
  # which is Bun, not the newest Node.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Traefik, Postgres and Redis are pinned in the production stack. A major
  # Postgres or Redis release changes the on-disk format and needs a planned
  # migration, so only minor and patch releases are proposed here.
  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]
