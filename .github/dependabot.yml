# Weekly pull requests for newer dependency versions.
#
# The audit in scripts/ci.sh fails on a new advisory, but it cannot tell that a
# fix for an ignored one has been released: its stale-entry check fires only
# after the lockfile moves. These pull requests are what move it. Minor and
# patch bumps arrive as one grouped pull request per ecosystem, and majors one
# at a time, since those are the ones that need reading.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Traefik, Postgres and Redis are pinned in the production stack. A major
  # Postgres or Redis release changes the on-disk format and needs a planned
  # migration, so only minor and patch releases are proposed here.
  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]
